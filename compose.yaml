name: peekaboo-pals

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: peekaboo-pals:local

services:
  # One-shot: the app runs as UID 10001, but on Linux hosts ./backend/data is
  # created by Docker as root or owned by the deploy user. Hand ownership of
  # anything not yet owned by the app user to it, then exit.
  data-permissions:
    <<: *app-image
    user: root
    entrypoint: ['find', '/data', '!', '-user', '10001', '-exec', 'chown', '10001:10001', '{}', '+']
    volumes:
      - ./backend/data:/data
    network_mode: none
    restart: 'no'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app-image
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${APP_PORT:-8089}:3001'
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Optional fixed admin token (16+ characters); empty uses the generated token file.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Public HTTPS origin; enables OAuth so claude.ai can connect to /mcp.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Extra public hostnames allowed to reach /mcp (comma-separated).
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      # Voice clips for new items and categories; read from .env, never committed.
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY:-}
      ELEVEN_LABS_VOICE_ID: ${ELEVEN_LABS_VOICE_ID:-}
      ELEVEN_LABS_MODEL_ID: ${ELEVEN_LABS_MODEL_ID:-}
    volumes:
      - ./backend/data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Uploads are capped at 20 MB (about 28 MB as base64 over MCP), so this leaves headroom.
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
