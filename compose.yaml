name: peekaboo-pals

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: peekaboo-pals:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3001"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./backend/data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
